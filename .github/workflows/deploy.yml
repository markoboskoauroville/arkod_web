# Tests, the structural check, the browser test, then the site to Cloudflare Pages
# (https://arkod-layer.pages.dev) and a release "vN" for version.json's N.
# Needs two repository secrets, added by Marko: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (Settings → Secrets and variables → Actions). Without them everything runs except the deploy.

name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (the Kotlin core's cases, ported)
        run: npm test
      - name: Structural check
        run: npm run verify
      - name: Browser test at 390 x 844
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: tests/screens/

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Are the Cloudflare secrets there?
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set. Add them in this repository: Settings → Secrets and variables → Actions → New repository secret. Then run this workflow again (Actions → deploy → Run workflow)."
            exit 1
          fi
      - name: Make sure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create arkod-layer --production-branch main || echo "the project is already there"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy public --project-name arkod-layer --branch main --commit-dirty=true
      - name: Deploy the background fetcher (Fetch when available, every 10 minutes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 deploy -c fetcher/wrangler.toml
      - name: Release vN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(node -p "require('./public/version.json').version")
          if gh release view "v$N" >/dev/null 2>&1; then
            echo "v$N is already released"
          else
            gh release create "v$N" --title "ARKOD Layer web · version $N" --notes "Live at https://arkod-layer.pages.dev · install: https://arkod-layer.pages.dev/install/"
          fi
