<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARKOD Layer</title>
<meta name="description" content="Katastarske čestice cijele Hrvatske na karti: posjedovni i vlasnički list, Moje čestice.">
<meta name="theme-color" content="#0B0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARKOD Layer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="anonymous">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="map" aria-label="map"></div>
  <div id="topwrap">
    <div id="top" aria-live="off">…</div>
    <div id="fields"></div>
  </div>
  <div id="cross" aria-hidden="true"></div>
  <div id="bottom">
    <div id="status" hidden></div>
    <div id="note" hidden aria-live="polite"></div>
    <nav id="keys" aria-label="keys"></nav>
  </div>
  <div id="faces" hidden></div>
</div>
<input type="file" id="import-file" accept=".json,application/json,.arkod.json" multiple hidden>
<input type="file" id="key-file" accept=".txt,.json,.env,text/plain,*/*" hidden>
<noscript>ARKOD Layer needs JavaScript.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin="anonymous"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
